name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "gradle"

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release-key.jks

      - name: Build release APK
        env:
          CI_KEYSTORE_FILE: /tmp/release-key.jks
          CI_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          CI_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          CI_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease

      - name: Get timestamp
        id: timestamp
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d-%H%M')
          echo "timestamp=$TIMESTAMP" >> "$GITHUB_OUTPUT"

      - name: Get commit message
        id: commit
        run: |
          MSG=$(git log -1 --pretty=%B)
          echo "message=$MSG" >> "$GITHUB_OUTPUT"

      - name: Rename APK
        run: mv app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/force-fastboot.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.timestamp.outputs.timestamp }}
          name: Release ${{ steps.timestamp.outputs.timestamp }}
          body: ${{ steps.commit.outputs.message }}
          files: app/build/outputs/apk/release/force-fastboot.apk
